<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar sesión – Control de Asistencia</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">CA</div>
      <h1>Control de Asistencia</h1>
      <p class="subtitle">Sistema biométrico con IA · Instituciones educativas</p>
      <div class="form-group">
        <label for="user">Usuario</label>
        <input id="user" type="text" placeholder="usuario" value="director.ie" autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="pass">Contraseña</label>
        <input id="pass" type="password" placeholder="••••••••" value="********" autocomplete="current-password" />
      </div>
      <div class="form-row">
        <label><input type="checkbox" checked /> Recordarme</label>
        <span>Contactar administrador</span>
      </div>
      <a href="dashboard.html" class="btn btn-primary btn-lg">Iniciar sesión</a>
    </div>
  </div>
</body>
</html>
